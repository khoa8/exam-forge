name: CI

on:
  # Feature branches are validated through their pull request; `main` is validated after
  # merge. A bare `push:` trigger would additionally run the full suite for every commit
  # pushed to a branch that already has an open PR, duplicating the pull_request run.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-readiness:
    name: production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (supported runtime, see .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (isolated server and disposable database)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Production smoke (build + isolated production server)
        run: npm run test:smoke:prod
